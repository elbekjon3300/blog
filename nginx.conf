# The web server settings of the blog. nginx listens on 8080 INSIDE the container.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # used by the smoke tests and by the Docker health check
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # the page and the data files change with every deploy: do not let browsers keep old copies
    location ~* \.(html|json)$ {
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
