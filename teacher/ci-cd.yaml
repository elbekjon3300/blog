name: Build my blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build my blog
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the tools
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build the blog
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the image and push it to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/blog:latest

      - name: Deploy to the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 5.133.141.122
          port: 22
          username: student
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            bash ~/yourname/deploy.sh ${{ secrets.DOCKERHUB_USERNAME }}
